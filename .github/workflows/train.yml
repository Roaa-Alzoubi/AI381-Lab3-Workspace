# Lab 3, Part 5: train candidates and enforce the model promotion gate.
# Full commit SHAs pin third-party Actions; update them deliberately.
name: train-and-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["src/**", "data/**", "scripts/**", "requirements*.txt", "artifacts/**", ".github/workflows/train.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: train and gate
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://localhost:5000
      GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned commit SHA
        with:
          fetch-depth: 0 # the gate needs history to read the base champion

      - name: Detect model-related changes
        id: changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          CHANGED=$(git diff --name-only "${BASE:-HEAD~1}...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(src/|data/|scripts/|artifacts/|requirements[^/]*\.txt$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pinned commit SHA
        if: steps.changes.outputs.relevant == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        if: steps.changes.outputs.relevant == 'true'

      - name: Start MLflow
        if: steps.changes.outputs.relevant == 'true'
        run: docker compose -f docker-compose.mlflow.yml up -d --wait

      - name: Find the champion to beat
        if: steps.changes.outputs.relevant == 'true'
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git show "${BASE:-HEAD~1}:artifacts/champion.json" > "$RUNNER_TEMP/champion.json" 2>/dev/null \
            && echo "Champion found:" && cat "$RUNNER_TEMP/champion.json" \
            || { echo "No champion on the base yet: the first good model will be promoted."; rm -f "$RUNNER_TEMP/champion.json"; }

      - name: Train the candidates
        if: steps.changes.outputs.relevant == 'true'
        run: |
          echo "BATCH=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          BATCH="${GITHUB_SHA::7}" python -m src.train.train_mlflow

      - name: Promotion gate
        if: steps.changes.outputs.relevant == 'true'
        run: python scripts/promote.py --champion-file "$RUNNER_TEMP/champion.json"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Gate"
            if [ "${{ steps.changes.outputs.relevant }}" = "true" ]; then
              echo "Model-related changes detected. Training and promotion gate were executed."
            else
              echo "Documentation-only or unrelated changes. Training was skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
